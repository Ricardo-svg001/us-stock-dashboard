services:
  - type: web
    name: us-stock-screener
    runtime: python
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    healthCheckPath: /healthz
    # workers 1 是刻意的：背景預抓與快取都在單一 process 內，
    # 多 worker 會各自預抓一份，浪費頻寬也吃記憶體。用 threads 撐併發即可。
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 600

    # 持久化磁碟：3 年份股價約 26 MB + 季報資料，跨部署保留才不用每次重抓
    disk:
      name: usstock-cache
      mountPath: /opt/render/project/src/cache
      sizeGB: 1

    envVars:
      # ⚠️ 鎖定 Python 版本。不指定的話會跟著 Render 的預設飄，
      #    而版本一升就可能移除已 deprecated 的 API（例如 datetime.utcnow()），
      #    症狀是「部署成功、跑起來才炸」——比建置失敗難查得多。
      #    升版要是你決定的，不是 Render 決定的。
      #    ⚠️ 若建置失敗說找不到這個版本，改成 Render 支援的相近版本即可。
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CACHE_DIR
        value: /opt/render/project/src/cache
      # 姊妹站連結（台股版已上線）
      - key: TW_URL
        value: https://stock-coffee.com
